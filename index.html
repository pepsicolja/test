<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub: проверка связи</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6edf3;font:18px system-ui}
main{max-width:560px;margin:24px;padding:40px;border:1px solid #30363d;border-radius:24px;background:#161b22}
h1{font-size:32px}p{color:#b1bac4;line-height:1.6}button{background:#238636;color:white;border:0;border-radius:10px;padding:14px 22px;font:inherit;cursor:pointer}button:hover{background:#2ea043}output{display:block;margin-top:24px}small{color:#8b949e}
</style>
</head>
<body>
<main>
<small>CODEX × GITHUB</small>
<h1>Связь установлена 🚀</h1>
<p>Эта страница создана через подключение к GitHub. Нажми кнопку — проверим, что всё работает.</p>
<button id="test" type="button">Проверить</button>
<output id="result" aria-live="polite">Проверок: 0</output>
</main>
<script>
let count=0;
document.getElementById('test').addEventListener('click',()=>{
count+=1;
document.getElementById('result').textContent='Всё работает! Проверок: '+count;
});
</script>
</body>
</html>
